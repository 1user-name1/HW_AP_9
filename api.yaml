openapi: 3.0.3
info:
  title: Library API
  description: Простое API для библиотеки. Можно смотреть книги, добавлять, менять и удалять.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: books
    description: Книги
security:
  - ApiKeyAuth: []
paths:
  /books:
    get:
      tags:
        - books
      summary: Получить список книг
      operationId: get_books
      parameters:
        - name: author
          in: query
          description: Фильтр по автору
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Сколько книг вернуть максимум
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Список книг
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '401':
          description: Не передан или неправильный API ключ (не знаем кто ты)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - books
      summary: Добавить новую книгу
      operationId: create_book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
      responses:
        '201':
          description: Книга создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Неправильные данные в запросе (например нет названия)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не передан или неправильный API ключ (не знаем кто ты)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Ключ правильный, но добавлять книги может только библиотекарь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /books/{bookId}:
    parameters:
      - name: bookId
        in: path
        description: id книги
        required: true
        schema:
          type: integer
    get:
      tags:
        - books
      summary: Получить одну книгу по id
      operationId: get_book_by_id
      responses:
        '200':
          description: Книга найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          description: Не передан или неправильный API ключ (не знаем кто ты)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Книги с таким id нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - books
      summary: Изменить книгу
      operationId: update_book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdate'
      responses:
        '200':
          description: Книга изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Неправильные данные в запросе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не передан или неправильный API ключ (не знаем кто ты)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Ключ правильный, но менять книги может только библиотекарь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Книги с таким id нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - books
      summary: Удалить книгу
      operationId: delete_book
      responses:
        '200':
          description: Книга удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: Не передан или неправильный API ключ (не знаем кто ты)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Ключ правильный, но удалять книги может только библиотекарь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Книги с таким id нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    # то что отдаем наружу. Внутренние поля (цена закупки, кто добавил и тд) сюда не попадают
    Book:
      type: object
      required:
        - id
        - title
        - author
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Война и мир
        author:
          type: string
          example: Лев Толстой
        year:
          type: integer
          example: 1869
        available:
          type: boolean
          description: Можно ли сейчас взять книгу
          example: true
    # для создания, id тут нет потому что его дает сервер
    BookCreate:
      type: object
      required:
        - title
        - author
      properties:
        title:
          type: string
          minLength: 1
          example: Война и мир
        author:
          type: string
          minLength: 1
          example: Лев Толстой
        year:
          type: integer
          example: 1869
    BookUpdate:
      type: object
      required:
        - title
        - author
      properties:
        title:
          type: string
          minLength: 1
          example: Война и мир
        author:
          type: string
          minLength: 1
          example: Лев Толстой
        year:
          type: integer
          example: 1869
        available:
          type: boolean
          example: false
    Message:
      type: object
      properties:
        message:
          type: string
          example: Книга удалена
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: Книга не найдена
